# SQL Server 2022 para desenvolvimento e para os benchmarks locais.
# Uso:
#   copy .env.example .env      (Windows)   |   cp .env.example .env   (Linux)
#   docker compose up -d
#   docker compose ps           -> aguarde o status "healthy"
#   docker compose down         -> para o contêiner e mantém os dados
#   docker compose down -v      -> para e APAGA o volume (banco zerado)

name: data-access-bench

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bench-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD no arquivo .env}"
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # -C confia no certificado autoassinado do contêiner (sqlcmd das mssql-tools18)
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  sqlserver-data:
